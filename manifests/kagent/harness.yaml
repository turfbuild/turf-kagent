# How the agent runs: kagent's own runtime (the image of the installed
# release), as an Actor on Agent Substrate's default WorkerPool, a gVisor
# sandbox per Session. Between turns the Actor is suspended and snapshotted to
# the bundled object store. A snapshot holds what the session holds (the
# plans and state the agent read, never the token or the model key): point
# snapshotPolicy at a bucket you control in production.
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: turf
  namespace: kagent
spec:
  kagent:
    # A plan and its results are long. Past this many prompt tokens, older
    # turns are summarized and the last 20 events kept as they are.
    compaction:
      tokenThreshold: 120000
      eventRetentionSize: 20
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/
