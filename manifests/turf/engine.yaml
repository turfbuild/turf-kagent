# turf-engine: Turf's planning and execution, and where provider plugins run,
# as a Knative service the Restate operator manages (RestateDeployment in
# knative mode). The operator creates a Knative Configuration and a
# cluster-local Route per tag, registers the Route's address with
# restate-server, and keeps the old tag's deployment until its invocations
# drain. Knative scales the pods with the work: from zero when a round starts,
# out while its steps run, back to zero when the cluster is quiet.
#
# The engine serves only requests restate-server signs (TURF_ENGINE_IDENTITY_KEYS
# is the public half of the key on the RestateCluster), and network-policies.yaml
# admits only Knative's data path besides.
#
# Providers run in the engine, so the engine holds their credentials. For the
# Lambda fleet that is one AWS access key (the turf-aws Secret, in the
# container's env below), scoped to the fleet's own names: what the key may do
# is what the agent's approved plans may do to the account. This
# ServiceAccount is bound to no Role: the engine changes nothing in the
# cluster it runs in. A configuration that manages Kubernetes too would bind
# it to what that configuration declares.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: turf-engine
  namespace: turf
---
apiVersion: restate.dev/v1beta1
kind: RestateDeployment
metadata:
  name: turf-engine
  namespace: turf
spec:
  deploymentMode: knative
  knative:
    # One tag per Turf minor release. A new tag is a new deployment:
    # restate-server sends new work to it, and the old one finishes what it
    # started, then drains. Keeping the tag updates in place (a new Knative
    # Revision under the same deployment), which Restate allows only for a
    # change compatible with invocations in flight: change the tag with the
    # image.
    tag: v1-4
    minScale: 0
    # Every pod that takes part in a stack's round starts that stack's
    # providers, and one AWS provider is most of a gigabyte once it has loaded
    # its schema. So few pods, each with room for several stacks: one stack's
    # round stays in a pod, and a second pod comes only with more stacks.
    maxScale: 2
    # Concurrent requests per pod before Knative adds one. A round's steps
    # are many short requests and a few long ones (a provider's apply).
    target: 20
  restate:
    register:
      cluster: turf
  template:
    metadata:
      labels:
        app: turf-engine
    spec:
      serviceAccountName: turf-engine
      # The longest a request may run. A provider's apply is one request,
      # capped first by restate-server's abort-timeout (30 minutes,
      # restate-cluster.yaml); this is the outer bound. Knative's own ceiling,
      # max-revision-timeout-seconds, is raised to match (setup/knative.sh).
      timeoutSeconds: 3600
      containers:
        - name: turf-engine
          # The same image as mcp-server.yaml and console.yaml: keep the three tags equal.
          image: ghcr.io/turfbuild/turf-mcp-server:v1.5.1
          command: ["/turf-engine"]
          args:
            - --addr=0.0.0.0:9080
            # The operator registers the Route; the engine only checks, at
            # start, that restate-server is a release it supports.
            - --register=false
            - --admin-addr=http://restate.turf.svc:9070
            # Each pod's own caches, emptied when Knative scales it away: a
            # pod installs providers and modules again the first time a step
            # lands on it.
            - --plugin-cache-dir=/turf/plugins
            - --data-dir=/turf/data
          env:
            # Uncomment to accept the Turf license terms (https://turf.build/license/v1/):
            # setting it accepts them. Without it every engine pod prints the license
            # notice and exits with code 77. See "Accept the license" in the README.
            # - name: TURF_ACCEPT_EULA
            #   value: "yes"
            - name: TURF_ENGINE_IDENTITY_KEYS
              valueFrom:
                secretKeyRef:
                  name: turf-engine-identity
                  key: public-key
            - name: TF_CLI_CONFIG_FILE
              value: /turf/cli/turf.tfrc
            # The AWS provider's credentials, read from the environment as the
            # provider always does: the key setup/aws makes and
            # setup/secrets.sh stores. No other pod mounts this Secret, and the
            # agent's sandbox is in another namespace. On EKS, drop these two
            # and give the ServiceAccount a role with EKS Pod Identity instead.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: turf-aws
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: turf-aws
                  key: secret-access-key
            - name: AWS_REGION
              value: us-west-2
          # The engine speaks HTTP/2 without TLS, and nothing else: Knative's
          # port name says so (h2c), and its default readiness check, a TCP
          # connect, is the only kind it answers.
          ports:
            - name: h2c
              containerPort: 9080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 5Gi
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: examples
              mountPath: /turf/examples
              readOnly: true
            - name: data
              mountPath: /turf/data
            - name: plugins
              mountPath: /turf/plugins
            - name: cli-config
              mountPath: /turf/cli
              readOnly: true
      volumes:
        # Knative admits image volumes with kubernetes.podspec-volumes-image
        # (setup/knative.sh).
        # The examples image: the turfbuild/turf-examples repository, read-only.
        # The agent gives Turf the path of the configuration to run inside it
        # (terraform/aws/lambda-fleet).
        - name: examples
          image:
            reference: ghcr.io/turfbuild/turf-examples:1.0.0
            pullPolicy: IfNotPresent
        - name: data
          emptyDir: {}
        - name: plugins
          emptyDir: {}
        - name: cli-config
          configMap:
            name: turf-cli-config
